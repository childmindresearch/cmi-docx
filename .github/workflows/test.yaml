name: Python Tests
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python_version: ["3.12", "3.13", "3.14"]
        resolution: [lowest-direct, highest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: pipx install uv
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
      - name: Install dependencies
        run: |
          uv sync --resolution=${{ matrix.resolution }}
        shell: bash
      - name: Run tests
        id: run-tests
        run: >
          uv run pytest \
            --junitxml=pytest.xml \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov=src tests \
            --log-level=DEBUG \
            --verbose
        shell: bash

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: pipx install uv
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
      - name: Install dependencies
        run: uv sync
        shell: bash
      - name: Run ty
        run: uv run ty check .
